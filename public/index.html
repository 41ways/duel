<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>결투</title>
<meta name="description" content="지금! 이 뜨면 먼저 쏴라. 최대 네 명이 붙는 서부 총잡이 반응속도 결투.">
<meta name="theme-color" content="#1a120c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Rye&family=Hahmlet:wght@700;900&family=Nanum+Pen+Script&family=Nanum+Brush+Script&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@900&family=Yuji+Syuku&text=%E4%B8%80%E9%A8%8E%E8%A8%8E%E6%BA%96%E5%82%99%E4%B8%AD&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤠</text></svg>">
</head>
<body data-view="title">

<canvas id="scene" aria-hidden="true"></canvas>
<div id="stage" aria-label="누르는 곳"></div>

<header class="top">
  <a class="brand" href="https://41ways.github.io/norara/">norara</a>
  <span>
    <button class="icon" id="muteBtn" aria-label="소리">🔊</button>
    <button class="icon" id="quitBtn" aria-label="그만하기">✕</button>
  </span>
</header>

<!-- 시작 -->
<section id="title" class="view">
  <button class="btn primary big" id="startGameBtn">게임 시작</button>
</section>

<!-- 처음 — 현상수배서 한 장 -->
<section id="home" class="view">
  <div class="poster">
    <p class="orn">DEAD OR ALIVE</p>
    <h2>결투</h2>
    <p class="sub">STANDOFF</p>
    <p class="how">멀리 선 상대를 노려보다 <b>지금!</b>이 뜨면 쏜다.<br>먼저 쏜 자가 산다. 그 전에 쏘면 오발.</p>
    <label class="field"><span>NAME</span><input id="nameIn" maxlength="10" placeholder="이름" autocomplete="off"></label>
    <button class="btn primary" id="createBtn">방 만들기</button>
    <div class="row">
      <label class="field"><span>No.</span><input id="codeIn" maxlength="4" placeholder="방 코드" autocomplete="off" autocapitalize="characters"></label>
      <button class="btn" id="joinBtn">들어가기</button>
    </div>
    <p class="rule"><span>OR</span></p>
    <div class="row">
      <button class="btn" id="soloBtn">봇이랑 연습</button>
      <button class="btn" id="pairBtn">한 기기 둘이</button>
    </div>
    <div class="row small">
      <label>봇 <select id="botN"><option>1</option><option>2</option><option>3</option></select>명</label>
      <label>실력 <select id="botLv"><option value="easy">쉬움</option><option value="normal" selected>보통</option><option value="hard">어려움</option></select></label>
    </div>
    <p class="err" id="homeErr"></p>
    <p class="banner">REPORT TO THE SHERIFF</p>
  </div>
</section>

<!-- 일기토 — 아직 준비 중. 수묵 느낌 미리보기 -->
<section id="soon" class="view ink">
  <div class="scroll">
    <h2 class="brush">一騎討</h2>
    <p class="vert">칼을 가는 중</p>
    <p class="brush-sub">사무라이 일대일 결투는 곧 열립니다</p>
    <span class="seal">準備中</span>
    <button class="btn inkbtn" id="soonBack">돌아가기</button>
  </div>
</section>

<!-- 대기실 — 수배서 벽은 캔버스가 그린다. 여기는 아래 단추 줄만 -->
<section id="lobby" class="view">
  <div class="bar">
    <div class="code-box">
      <small>방 코드</small><b class="code" id="roomCode">----</b>
      <button class="btn slim" id="copyBtn">초대 링크 복사</button>
    </div>
    <div class="opts" id="hostOpts">
      <button class="btn slim" id="addBotBtn">+ 봇</button>
      <select id="addBotLv"><option value="easy">쉬움</option><option value="normal" selected>보통</option><option value="hard">어려움</option></select>
      <select data-cfg="target"><option value="1">단판</option><option value="3">3선승</option><option value="5">5선승</option></select>
      <select data-cfg="signal"><option value="mix">신호: 화면</option><option value="sound">신호: 소리만</option></select>
      <select data-cfg="decoys"><option value="true">거짓 신호 포함</option><option value="false">거짓 신호 없음</option></select>
    </div>
    <span class="err" id="lobbyErr"></span>
    <div class="go">
      <button class="btn" id="leaveBtn">나가기</button>
      <button class="btn primary" id="startBtn">결투 시작</button>
    </div>
  </div>
</section>

<!-- 끝 — 승자 장면 위에 결과판 -->
<section id="over" class="view">
  <div class="result">
    <p class="kicker" id="overKicker">RESULT</p>
    <h2 id="overTitle"></h2>
    <ol class="ranks" id="overList"></ol>
    <div class="acts">
      <button class="btn primary big" id="againBtn">한 판 더</button>
      <button class="btn ghost" id="lobbyBtn">대기방으로</button>
      <button class="btn ghost" id="homeBtn">처음으로</button>
    </div>
    <p class="wait" id="overWait"></p>
  </div>
</section>

<div id="toast"></div>

<script src="/duel.js"></script>
<script src="/sound.js"></script>
<script src="/west.js"></script>
<script src="/app.js"></script>
</body>
</html>
