<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>결투</title>
<meta name="description" content="지금! 이 뜨면 먼저 쏴라. 최대 네 명이 붙는 서부 총잡이 반응속도 결투.">
<meta name="theme-color" content="#1a120c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Rye&family=Hahmlet:wght@700;900&family=Nanum+Pen+Script&family=Nanum+Brush+Script&family=Song+Myung&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@900&family=Yuji+Syuku&text=%E4%B8%80%E9%A8%8E%E8%A8%8E%E6%BA%96%E5%82%99%E4%B8%AD&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
</head>
<body data-view="title">

<canvas id="scene" aria-hidden="true"></canvas>
<div id="stage" aria-label="누르는 곳"></div>

<header class="top">
  <a class="brand" href="https://41ways.github.io/norara/">norara</a>
  <span>
    <button class="icon" id="muteBtn" aria-label="소리">🔊</button>
    <button class="icon" id="quitBtn" aria-label="그만하기">✕</button>
  </span>
</header>

<!-- 시작 -->
<section id="title" class="view">
  <button class="btn primary big" id="startGameBtn">게임 시작</button>
</section>

<!-- 처음 — 왼쪽 마을 게시판에 열린 방, 오른쪽 수배서는 사진 칸이 뚫려 뒤에 선 사람 얼굴이 비친다 -->
<section id="home" class="view">
  <button class="back" id="backSelect">☜ 방식 다시 고르기</button>
  <div class="townboard">
    <div class="tb-in">
      <p class="tb-head">열린 방 <small id="online"></small></p>
      <ul id="roomList"></ul>
      <p class="rb-empty" id="roomEmpty">아직 열린 방이 없어요. 오른쪽에서 방을 만들어 보세요.</p>
    </div>
  </div>
  <div class="sheet holed">
    <div class="hole" id="faceHole"></div>
    <p class="doa">DEAD OR ALIVE</p>
    <label class="field"><span>NAME</span><input id="nameIn" maxlength="10" placeholder="이름을 적으세요" autocomplete="off"></label>
    <button class="btn primary" id="createBtn">방 만들기</button>
    <div class="joinrow">
      <label class="field"><span>No.</span><input id="codeIn" maxlength="4" placeholder="방 코드" autocomplete="off" autocapitalize="characters"></label>
      <button class="btn" id="joinBtn">들어가기</button>
    </div>
    <button class="link" id="pairBtn">☞ 한 기기로 둘이 하기 <small>한 화면을 반으로 — 왼쪽 사람은 왼쪽을, 오른쪽 사람은 오른쪽을 클릭</small></button>
    <p class="err" id="homeErr"></p>
  </div>
</section>

<!-- 일기토 — 아직 준비 중. 수묵 느낌 미리보기 -->
<section id="soon" class="view ink">
  <div class="scroll">
    <h2 class="brush">一騎討</h2>
    <p class="vert">칼을 가는 중</p>
    <p class="brush-sub">사무라이 일대일 결투는 곧 열립니다</p>
    <span class="seal">準備中</span>
    <button class="btn inkbtn" id="soonBack">돌아가기</button>
  </div>
</section>

<!-- 대기실 — 왼쪽 방 설정 · 오른쪽 위 사람들(수배서 벽은 캔버스가 #wall 자리에 그린다) · 그 아래 채팅 -->
<section id="lobby" class="view">
  <aside class="rules">
    <p class="rules-kicker">ROOM No.</p>
    <b class="code" id="roomCode">----</b>
    <button class="btn slim" id="copyBtn">초대 링크 복사</button>
    <div class="rules-list" id="hostOpts">
      <label><span>판 수</span><select data-cfg="target"><option value="1">단판</option><option value="3">3선승</option><option value="5">5선승</option></select></label>
      <label><span>신호</span><select data-cfg="signal"><option value="mix">화면에 "지금!"</option><option value="sound">소리만</option></select></label>
      <label><span>거짓 신호</span><select data-cfg="decoys"><option value="true">포함</option><option value="false">없음</option></select></label>
    </div>
    <p class="rules-note" id="rulesNote"></p>
    <span class="err" id="lobbyErr"></span>
    <div class="go">
      <button class="btn primary" id="startBtn">결투 시작</button>
      <button class="btn" id="leaveBtn">나가기</button>
    </div>
  </aside>
  <div id="wall"></div>
  <div class="chat" id="chat">
    <p class="chat-kicker">SALOON TALK</p>
    <ol id="chatLog"></ol>
    <form id="chatForm" autocomplete="off"><input id="chatIn" maxlength="120" placeholder="한마디 적기"><button class="btn slim">보내기</button></form>
  </div>
  <div class="slotmenu" id="slotMenu"><p class="sm-title" id="smTitle"></p><div class="sm-body" id="smBody"></div></div>
</section>

<!-- 끝 — 승자 장면 위에 결과판 -->
<section id="over" class="view">
  <div class="result">
    <p class="kicker" id="overKicker">RESULT</p>
    <h2 id="overTitle"></h2>
    <ol class="ranks" id="overList"></ol>
    <div class="acts">
      <button class="btn primary big" id="againBtn">한 판 더</button>
      <button class="btn ghost" id="lobbyBtn">대기방으로</button>
      <button class="btn ghost" id="homeBtn">처음으로</button>
    </div>
    <p class="wait" id="overWait"></p>
  </div>
</section>

<div id="pairHint"><span>◀ 왼쪽 사람 · 화면 왼쪽을 클릭</span><span>화면 오른쪽을 클릭 · 오른쪽 사람 ▶</span></div>
<div id="toast"></div>

<script src="/duel.js"></script>
<script src="/sound.js"></script>
<script src="/west.js"></script>
<script src="/app.js"></script>
</body>
</html>
