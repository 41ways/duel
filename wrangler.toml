# 결투 — Cloudflare Workers 무료 플랜
# 화면 파일은 정적 자산으로, 소켓(/ws)만 Worker → Durable Object 로 간다.
name = "duel"
main = "worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/ws", "/healthz"]

[[durable_objects.bindings]]
name = "GAME"
class_name = "DuelGame"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DuelGame"]
